[package]
name = "agent-sudo"
version = "1.0.4"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
getrandom = "0.3"
zeroize = { version = "1", features = ["derive"] }
subtle = "2"
base64 = "0.22.1"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
